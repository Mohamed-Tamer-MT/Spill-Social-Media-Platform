name: Tests

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  test:
    name: Unit & Integration Tests (-race)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run all tests with -race
        run: go test -v -race -count=1 ./...

      - name: Check Service Test Coverage (>= 80%)
        run: |
          go test -race -coverprofile=services_coverage.out ./internal/services
          COVERAGE=$(go tool cover -func=services_coverage.out | grep "total:" | awk '{print $3}' | tr -d '%')
          echo "Service statement coverage: ${COVERAGE}%"
          awk -v cov="$COVERAGE" 'BEGIN { if (cov < 80.0) { print "Coverage below 80%: " cov "%"; exit 1 } else { print "Coverage meets requirement: " cov "%"; exit 0 } }'
